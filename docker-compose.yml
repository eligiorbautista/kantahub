services:
  kantahub:
    build: .
    image: kantahub:latest
    container_name: kantahub
    ports:
      # Host port 3005 -> container 3005 (host 3000 was already taken by another
      # app). The container PORT matches so the phone-remote QR advertises the
      # right URL. Override with KANTAHUB_PORT if needed.
      - "${KANTAHUB_PORT:-3005}:${KANTAHUB_PORT:-3005}"
    environment:
      # Keep the listening port in sync with the published host port above so the
      # QR/remote URL built from PORT is correct.
      - PORT=${KANTAHUB_PORT:-3005}
      # Optional LAN URL override (e.g. http://192.168.1.50:3005). When empty
      # the app auto-detects the first non-loopback IPv4 address.
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Persisted library index cache (named volume below) so restarts are fast.
      - INDEX_DIR=/index
    volumes:
      # Supply your own legally obtained MIDI/karaoke files and SoundFont here.
      - ./songs:/songs
      - ./sound:/sound
      # Optional background images/videos; may be empty.
      - ./media:/media
      # Optional music: idle background tracks and a score cheer (cheer*.mp3).
      - ./music:/music
      - kantahub-index:/index
    restart: unless-stopped

  # HTTPS front door: browsers only expose the karaoke audio engine
  # (AudioWorklet) in a secure context, so a plain http:// LAN address cannot
  # play music. Open the TV/phone at https://<host>:3443 instead; the browser
  # warns once about the self-signed certificate (Advanced -> Proceed).
  # The app itself is untouched and still serves plain http on 3005.
  kantahub-https:
    image: kantahub:latest
    container_name: kantahub-https
    command: ["node", "https-proxy.mjs"]
    ports:
      - "3443:3443"
    environment:
      # The address clients use; signed into the certificate and used for QR codes.
      - KANTAHUB_TLS_HOST=${KANTAHUB_TLS_HOST:-192.168.1.2}
      - TLS_DIR=/tls
      - TARGET_HOST=kantahub
      - TARGET_PORT=${KANTAHUB_PORT:-3005}
    volumes:
      # Keeps the certificate across restarts, so the browser warning is a
      # one-time thing per device.
      - kantahub-tls:/tls
    depends_on:
      - kantahub
    restart: unless-stopped

volumes:
  kantahub-index:
  kantahub-tls:
